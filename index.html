<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><link rel="manifest" href="manifest.webmanifest"><title>NOVA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
main{min-height:100vh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:22px 0}.orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#78b7ff 25%,#3156ff 55%,#111a55 75%);box-shadow:0 0 28px #4169ff99}
h1{font-size:28px;margin:0}small{color:#9da6b8}.chat{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#aeb6c7}.composer{display:flex;gap:8px;padding:12px 0 18px}.composer input{flex:1;background:#171b26;border:1px solid #303747;color:white;border-radius:22px;padding:13px 16px;font-size:16px}.composer button{border:0;border-radius:50%;width:48px;background:#3156ff;color:white;font-size:20px}
.msg{max-width:85%;margin:8px 0;padding:12px 15px;border-radius:18px;background:#171b26;text-align:left}.user{margin-left:auto;background:#263c91}
</style></head><body><main>
<header><div class="orb"></div><div><h1>NOVA</h1><small>Assistant central — iPhone</small></div></header>
<section id="chat" class="chat"><div>Bonjour. NOVA est prête à être configurée.</div></section>
<form id="form" class="composer"><input id="input" autocomplete="off" placeholder="Parle à NOVA…"><button>➤</button></form>
</main>
<script>
const chat=document.querySelector('#chat'), form=document.querySelector('#form'), input=document.querySelector('#input');
function add(text,cls){if(chat.classList.contains('chat'))chat.classList.remove('chat');const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
form.onsubmit=e=>{e.preventDefault();let t=input.value.trim();if(!t)return;add(t,'user');input.value='';setTimeout(()=>add("Je t’écoute. Le noyau NOVA peut maintenant être relié à tes services et à la voix.",'nova'),300)}
</script></body></html>
